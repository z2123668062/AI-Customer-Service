server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 全站唯一鉴权：没有用户体系，只有一个固定账号 + 一个密码。
    # 声明在 server 层，所有 location 默认继承 —— 页面、静态资源、/api 全部拦住；
    # 只有 /health 显式关掉（Docker healthcheck 和 CVM 上的 curl 验证都是裸访问）。
    auth_basic "MemoryAssistant";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Vue Router history 模式：未知路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查透传（compose 与 CVM 验证都用它）
    location = /health {
        auth_basic off;
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API 反代。SSE 关键：关闭缓冲、拉长超时、保持长连接
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # Vite 构建产物带 hash，可长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 10m;
}
